name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm test
      # node:test suite over the dev mock AI server (CORS + SSE contract)
      # and the release-integrity script; CI previously ran only the
      # vitest suite, so these could rot silently.
      - run: pnpm test:dev
      - run: pnpm exec prettier --check .
      - run: node dev/check-release-integrity.mjs
      # Plan 077: dependency audit gate (fails only on high/critical).
      # The 5 highs triaged 2026-09-03 (4 fast-uri + nanoid, all
      # unreachable dev-only chains under shadcn) are fixed by
      # semver-compatible pnpm.overrides in package.json
      # (nanoid 3.3.18, fast-uri 3.1.6). A 6th high appeared
      # 2026-09-27 — js-yaml <4.3.2 (GHSA-2883-xcg3-v3hh, a CPU DoS in
      # the same unreachable shadcn chain) — also fixed by an override.
      # Remaining baseline is 2 low + 15 moderate. Revisit if new highs
      # appear.
      #
      # 2026-10-15 round: new advisories against the same unreachable
      # dev-only chains. Fixed by overrides — fast-uri 3.1.7 (new
      # advisories against the pinned 3.1.6), proxy-addr 2.0.8
      # (critical, via the shadcn CLI's MCP SDK -> express),
      # @modelcontextprotocol/sdk 1.31.0, undici 8.10.2 (jsdom and
      # shadcn), brace-expansion 5.0.11 (eslint -> minimatch) and
      # source-map-js 1.2.2 (jsdom -> css-tree). One high has no
      # patched release at all — braces <=3.0.3 (GHSA-vfj7-8cjw-p6xm, a
      # stack-exhaustion DoS in glob patterns, reachable only through
      # the shadcn CLI's fast-glob) — so it is ignored via
      # pnpm.auditConfig.ignoreGhsas and this note. Remove the ignore
      # once upstream ships a fix.
      - run: pnpm audit --audit-level=high

  # Plan 077: Rust advisory audit on linux only (cargo-audit recompiles
  # per run; windows/macos matrix legs would triple the cost for nothing).
  audit-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-audit --locked
      # cargo-audit auto-detects Cargo.lock from the working directory
      # (no --manifest-path flag in 0.22); run from the crate root.
      - working-directory: src-tauri
        run: cargo audit

  desktop:
    strategy:
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: pnpm install --frozen-lockfile
      - run: cargo test --manifest-path src-tauri/Cargo.toml --lib
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # tauri-action only uploads when a tag/release is configured; without
      # one it builds and discards the bundles. Upload them explicitly so
      # every push exposes fresh installers as run artifacts (macOS dmg +
      # .app, Windows msi + nsis).
      - name: Upload installers
        uses: actions/upload-artifact@v5
        with:
          name: papyrus-${{ matrix.platform }}
          path: src-tauri/target/release/bundle/**
          if-no-files-found: warn
